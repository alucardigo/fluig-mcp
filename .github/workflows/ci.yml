name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Checagem de sintaxe
        run: npm run check

      - name: Testes unitários
        run: npm test

      # A superfície de ferramentas precisa ser inspecionável SEM credencial — é isso que
      # permite auditar o servidor antes de entregar uma senha a ele. Logo, é um teste.
      - name: Lista as ferramentas sem nenhuma configuração
        run: |
          node server.js --list
          test "$(node server.js --list | grep -cE 'fluig_[a-z_0-9]+:')" -eq 97

      - name: Modo somente leitura não expõe nenhuma escrita
        env:
          FLUIG_READONLY: '1'
        run: |
          node server.js --list
          test "$(node server.js --list | grep -cE '^\s+!\s')" -eq 0

      # Variável faltando tem que falhar alto, nunca cair num servidor default.
      - name: Sem configuração, falha limpo
        run: |
          if node server.js; then
            echo 'esperava saída != 0 sem FLUIG_HOST/USER/PASS' >&2
            exit 1
          fi

  scan-segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
