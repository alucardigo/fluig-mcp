name: Release

# Roda quando um Release do GitHub é publicado (tag vX.Y.Z). O processo recebe credenciais de
# produção do Fluig, então a cadeia de publicação precisa ser verificável: o pacote sai daqui,
# nunca da máquina de alguém.
#
# Gera três coisas:
# 1. o tarball do npm anexado ao Release, para quem quer instalar sem registro nenhum;
# 2. o pacote @alucardigo/fluig-mcp no GitHub Packages, com o token do próprio Actions;
# 3. o pacote fluig-mcp no npmjs.com, com provenance (atestado de qual commit e qual workflow o
#    geraram), por staged publishing: o CI prepara e um mantenedor aprova com 2FA. Só roda com a
#    variável de repositório NPM_PUBLICAR=true e o segredo NPM_TOKEN (granular, SEM bypass de 2FA:
#    preparar não exige 2FA).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag de um Release já publicado (ex.: v1.1.0)'
        required: true

permissions: {}

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # Sem cache de propósito: cache compartilhado em job de publicação é vetor de envenenamento.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: A tag bate com a versão do package.json
        id: versao
        run: |
          versao="$(node -p 'require("./package.json").version')"
          if [ "v$versao" != "$TAG" ]; then
            echo "tag $TAG, package.json v$versao" >&2
            exit 1
          fi
          echo "versao=$versao" >> "$GITHUB_OUTPUT"

  anexar-tarball:
    needs: verificar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # anexar o arquivo ao Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Empacota e anexa ao Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arquivo="$(npm pack --silent)"
          sha256sum "$arquivo" > "$arquivo.sha256"
          gh release upload "$TAG" "$arquivo" "$arquivo.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  github-packages:
    needs: verificar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@alucardigo'
      # O registro do GitHub só aceita pacote com o escopo do dono; o nome muda só nesta cópia.
      - run: npm pkg set name=@alucardigo/fluig-mcp
      # Idempotente: rodar de novo o Release (ex.: para ligar o npm depois) não falha aqui.
      - name: Publica, se a versão ainda não estiver lá
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.verificar.outputs.versao }}
        run: |
          if npm view "@alucardigo/fluig-mcp@$VERSAO" version >/dev/null 2>&1; then
            echo "@alucardigo/fluig-mcp@$VERSAO já está no GitHub Packages"
          else
            npm publish
          fi

  npm:
    needs: verificar
    if: vars.NPM_PUBLICAR == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write   # OIDC do trusted publishing e assinatura do provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # `npm stage` existe a partir do npm 11.15.
      - name: npm com suporte a staged publishing
        run: |
          if ! npm stage --help >/dev/null 2>&1; then npm install -g npm@11.16.0; fi
          npm --version
      # Staged publishing: o CI só PREPARA a versão; ela fica pública depois que um mantenedor aprova
      # com 2FA (aba Staged Packages do npmjs.com, ou `npm stage approve <id>`). Token que dispensa
      # 2FA perde a publicação direta em janeiro de 2027, e um token roubado daqui não publica nada
      # sozinho.
      - name: Prepara a versão para aprovação, se ainda não estiver no npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSAO: ${{ needs.verificar.outputs.versao }}
        run: |
          if npm view "fluig-mcp@$VERSAO" version >/dev/null 2>&1; then
            echo "fluig-mcp@$VERSAO já está no npm"
          else
            npm stage publish --provenance --access public | tee stage.txt
            {
              echo "### fluig-mcp@$VERSAO aguardando aprovação no npm"
              echo
              echo "Aprove com 2FA em https://www.npmjs.com/settings/~/packages/staged (aba Staged Packages)"
              echo "ou com \`npm stage approve <id>\`. Saída do npm:"
              echo
              echo '```'
              cat stage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
